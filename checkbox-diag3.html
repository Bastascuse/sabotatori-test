<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#0a0a0a;}</style>
</head>
<body>
<iframe id="kf" style="width:100%;height:900px;border:0;"></iframe>
<script>
function costruisciSrcdocEmbed(cfg) {
  var css = '' +
    'html,body{margin:0!important;padding:0!important;background:transparent!important;font-family:inherit!important;}' +
    '.kartra_optin_bgcolor{background:transparent!important;}' +
    '.kartra_optin_popover{background:#1a1a1a!important;color:#eee!important;border:1px solid #333!important;}' +
    '.kartra_optin_ti,input.kartra_optin_ti,input[type=text].kartra_optin_ti,input[type=email].kartra_optin_ti,input[type=tel].kartra_optin_ti{' +
    'width:100%!important;box-sizing:border-box!important;padding:16px 44px 16px 16px!important;' +
    'border:1px solid #333!important;border-radius:8px!important;font-size:17px!important;font-family:inherit!important;' +
    'background:#1a1a1a!important;color:#fff!important;}' +
    '.kartra_optin_ti::placeholder{color:#888!important;}' +
    'label,.kartra_optin_controls,.kartra_optin_controls *,p,span,div{color:#eee!important;}' +
    '.kartra-optin-checkbox small{border:2px solid #ffffff!important;background-color:transparent!important;' +
    'background-image:none!important;box-sizing:border-box!important;opacity:1!important;' +
    'display:flex!important;align-items:center!important;justify-content:center!important;' +
    'padding:0!important;margin:0!important;text-indent:0!important;' +
    'overflow:hidden!important;line-height:1!important;font-size:14px!important;font-weight:900!important;text-align:center!important;}' +
    '.kartra-optin-checkbox small *{box-sizing:border-box!important;}' +
    '.kartra_optin_footer-poweredby{opacity:0.55!important;}' +
    '.kartra_optin_submit_btn,.kartra_optin_submit_btn:disabled,.kartra_optin_submit_btn *{width:100%!important;padding:18px!important;' +
    'background:#f0c14b!important;color:#0a0a0a!important;border:none!important;' +
    'border-radius:8px!important;font-size:17px!important;font-weight:800!important;letter-spacing:0.3px!important;cursor:pointer!important;' +
    'font-family:inherit!important;text-transform:uppercase!important;margin-top:8px!important;box-sizing:border-box!important;box-shadow:none!important;}' +
    'a{color:#f0c14b!important;}';
  var js = '' +
    'function bs_syncCheckboxVisual(cb){' +
    'var vis = cb.nextElementSibling;' +
    'if(!vis || vis.tagName !== "SMALL") return;' +
    'if(cb.checked){' +
    'vis.style.setProperty("background","#000000","important");' +
    'vis.style.setProperty("border","2px solid #ffffff","important");' +
    'vis.innerHTML = "<span style=\\"display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;box-sizing:border-box!important;color:#ffffff!important;font-weight:900!important;font-size:13px!important;line-height:1!important;font-family:Arial,Helvetica,sans-serif!important;transform:translateY(-0.5px)!important;\\">&#10003;<\\/span>";' +
    '} else {' +
    'vis.style.setProperty("background","transparent","important");' +
    'vis.style.setProperty("border","2px solid #ffffff","important");' +
    'vis.innerHTML = "";' +
    '}' +
    '}' +
    'document.addEventListener("click", function(e){' +
    'var t = e.target;' +
    'if(t && t.tagName === "INPUT" && t.type === "checkbox"){ setTimeout(function(){ bs_syncCheckboxVisual(t); }, 0); }' +
    '}, true);' +
    'document.addEventListener("change", function(e){' +
    'var t = e.target;' +
    'if(t && t.tagName === "INPUT" && t.type === "checkbox"){ bs_syncCheckboxVisual(t); }' +
    '}, true);' +
    'var bs_syncTries = 0;' +
    'var bs_syncInterval = setInterval(function(){' +
    'bs_syncTries++;' +
    'var boxes = document.querySelectorAll("input[type=checkbox]");' +
    'boxes.forEach(function(cb){ bs_syncCheckboxVisual(cb); });' +
    'if(bs_syncTries >= 20) clearInterval(bs_syncInterval);' +
    '}, 300);';
  return '<!DOCTYPE html><html><head><meta charset="utf-8">' +
    '<style>' + css + '</style></head><body style="background:transparent">' +
    '<div class="kartra_optin_container' + cfg.hash + '"></div>' +
    '<script src="https://app.kartra.com/optin/' + cfg.optinId + '"><\/script>' +
    '<style>' + css + '</style>' +
    '<script>' + js + '<\/script>' +
    '</body></html>';
}
var cfg = { optinId: 'tJQipfrjxYZa', hash: '550a141f12de6341fba65b0ad0433500' };
document.getElementById('kf').srcdoc = costruisciSrcdocEmbed(cfg);
</script>
</body>
</html>
